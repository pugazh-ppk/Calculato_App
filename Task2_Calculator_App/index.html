<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 - Calculator</title><link rel="stylesheet" href="style.css">
</head><body>
<main class="calculator">
<p class="tag">TASK 02 · JAVASCRIPT</p><h1>Calculator</h1>
<p class="sub">Built with HTML, CSS & JavaScript</p>
<div class="display"><div id="previous"></div><div id="current">0</div></div>
<div class="keys">
<button class="utility" data-action="clear">AC</button><button class="utility" data-action="delete">⌫</button><button class="operator" data-op="÷">÷</button><button class="operator" data-op="×">×</button>
<button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="operator" data-op="−">−</button>
<button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="operator" data-op="+">+</button>
<button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="equals" data-action="equals">=</button>
<button class="zero" data-num="0">0</button><button data-num=".">.</button>
</div><footer>HTML · CSS · JavaScript</footer>
</main><script src="script.js"></script></body></html>
